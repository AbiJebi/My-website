<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JB World</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

/* ================= GENERAL ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(
        135deg,
        #fff0f5,
        #ffe4ec
    );

    color: #333;
}


/* ================= HEADER ================= */

.header {

    text-align: center;

    padding: 35px 15px 25px;

    background: linear-gradient(
        135deg,
        #ff4f81,
        #ff8fab
    );

    color: white;

    position: relative;

    overflow: hidden;
}

.header h1 {

    font-size: 38px;

    margin-bottom: 8px;
}

.header p {

    font-size: 18px;
}


/* Hearts */

.heart {

    position: absolute;

    font-size: 70px;

    opacity: 0.25;
}

.heart.left {

    left: 8%;

    top: 20px;
}

.heart.right {

    right: 8%;

    bottom: 10px;
}


/* ================= TABS ================= */

.tabs {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 10px;

    padding: 18px;

    background: white;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.1);
}

.tab-button {

    border: none;

    padding: 13px 20px;

    border-radius: 25px;

    background: #ffe1ea;

    color: #d63364;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;
}

.tab-button.active {

    background: #ff4f81;

    color: white;
}

.tab-button:hover {

    background: #ff6f9a;

    color: white;
}


/* ================= CONTENT ================= */

.container {

    width: 95%;

    max-width: 1100px;

    margin: 25px auto;
}

.section-title {

    text-align: center;

    margin-bottom: 20px;

    color: #d63364;
}


/* ================= ADD BOX ================= */

.add-box {

    background: white;

    padding: 20px;

    border-radius: 15px;

    margin-bottom: 20px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

.add-box h3 {

    margin-bottom: 15px;

    color: #d63364;
}

.form-row {

    display: flex;

    gap: 10px;

    flex-wrap: wrap;
}

.form-row input {

    flex: 1;

    min-width: 180px;

    padding: 12px;

    border: 1px solid #ddd;

    border-radius: 8px;

    font-size: 15px;
}

.add-btn {

    padding: 12px 22px;

    border: none;

    border-radius: 8px;

    background: #ff4f81;

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.add-btn:hover {

    background: #d63364;
}


/* ================= TABLE ================= */

.table-container {

    background: white;

    border-radius: 15px;

    overflow-x: auto;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.08);
}

table {

    width: 100%;

    border-collapse: collapse;

    min-width: 700px;
}

thead {

    background: #ff4f81;

    color: white;
}

th,
td {

    padding: 15px;

    text-align: center;

    border-bottom: 1px solid #eee;
}

th:nth-child(2),
td:nth-child(2) {

    text-align: left;
}

th:nth-child(3),
td:nth-child(3) {

    text-align: left;
}


/* ================= CHECKBOX ================= */

.status-checkbox {

    width: 22px;

    height: 22px;

    cursor: pointer;

    accent-color: #ff4f81;
}


/* ================= DELETE ================= */

.delete-btn {

    border: none;

    background: #ffebef;

    color: #e6395f;

    padding: 7px 10px;

    border-radius: 7px;

    cursor: pointer;
}

.delete-btn:hover {

    background: #e6395f;

    color: white;
}


/* ================= COMPLETED ================= */

.completed {

    text-decoration: line-through;

    opacity: 0.55;
}


/* ================= LOADING ================= */

.loading {

    text-align: center;

    padding: 30px;

    color: #d63364;
}


/* ================= FOOTER ================= */

footer {

    text-align: center;

    padding: 25px;

    margin-top: 40px;

    background: #ff4f81;

    color: white;
}


/* ================= MOBILE ================= */

@media (max-width: 600px) {

    .header h1 {

        font-size: 30px;
    }

    .header p {

        font-size: 16px;
    }

    .tab-button {

        font-size: 13px;

        padding: 10px 13px;
    }

    .container {

        width: 96%;
    }

    .form-row {

        flex-direction: column;
    }

    .form-row input,
    .add-btn {

        width: 100%;
    }
}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

    <div class="heart left">❤️</div>

    <div class="heart right">❤️</div>

    <h1>
        ❤️ Welcome to JB World ❤️
    </h1>

    <p>
        Our Little Household Manager
    </p>

</header>


<!-- ================= TABS ================= -->

<div class="tabs">

    <button
        class="tab-button active"
        onclick="showTab('tasks', this)">

        📋 Today's Task

    </button>


    <button
        class="tab-button"
        onclick="showTab('groceries', this)">

        🛒 Groceries

    </button>


    <button
        class="tab-button"
        onclick="showTab('vegetables', this)">

        🥕 Vegetables

    </button>


    <button
        class="tab-button"
        onclick="showTab('todo', this)">

        ✅ To Do List

    </button>

</div>


<!-- ================= MAIN ================= -->

<div class="container">


    <h2
        class="section-title"
        id="sectionTitle">

        📋 Today's Task

    </h2>


    <!-- ADD ITEM -->

    <div class="add-box">

        <h3>
            ➕ Add New Item
        </h3>


        <div class="form-row">


            <input
                type="text"
                id="itemName"
                placeholder="Name">


            <input
                type="text"
                id="itemDescription"
                placeholder="Description">


            <button
                class="add-btn"
                onclick="addItem()">

                Add

            </button>

        </div>

    </div>


    <!-- TABLE -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        S.No
                    </th>

                    <th>
                        Name
                    </th>

                    <th>
                        Description
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody
                id="tableBody">

                <tr>

                    <td
                        colspan="5"
                        class="loading">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


<!-- ================= FOOTER ================= -->

<footer>

    ❤️ JB World — Our Home, Our Happiness ❤️

</footer>


<script>

/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */


/*
    YOUR SUPABASE PROJECT URL
*/

const SUPABASE_URL =
    "https://zuokrmjppxnlcmumeamq.supabase.co";


/*
    PASTE YOUR SUPABASE PUBLISHABLE KEY HERE

    Example:

    const SUPABASE_KEY =
        "sb_publishable_xxxxxxxxx";

*/

const SUPABASE_KEY =
    "sb_publishable_pZJjNN3iLCqWTxunDCKsvQ_WEphdmiZ";


/*
    Create Supabase client
*/

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   CURRENT TAB
   ===================================================== */

let currentTab = "tasks";


/* =====================================================
   TAB TITLES
   ===================================================== */

const tabTitles = {

    tasks:
        "📋 Today's Task",

    groceries:
        "🛒 Groceries",

    vegetables:
        "🥕 Vegetables",

    todo:
        "✅ To Do List"

};


/* =====================================================
   GET TODAY'S DATE
   ===================================================== */

function getTodayDate() {

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            today.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}


/* =====================================================
   SHOW TAB
   ===================================================== */

function showTab(tab, button) {

    currentTab = tab;


    document
        .querySelectorAll(".tab-button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    document
        .getElementById("sectionTitle")
        .innerText =
            tabTitles[tab];


    loadItems();

}


/* =====================================================
   ADD ITEM
   ===================================================== */

async function addItem() {


    const name =
        document
        .getElementById("itemName")
        .value
        .trim();


    const description =
        document
        .getElementById("itemDescription")
        .value
        .trim();


    if (name === "") {

        alert(
            "Please enter a name."
        );

        return;

    }


    const today =
        getTodayDate();


    /*
        Add to Supabase
    */

    const { data, error } =
        await db
        .from("household_items")
        .insert([

            {

                category:
                    currentTab,

                name:
                    name,

                description:
                    description,

                completed:
                    false,

                task_date:
                    today

            }

        ]);


    if (error) {

        console.error(error);

        alert(
            "Unable to add item. Check Supabase connection."
        );

        return;

    }


    /*
        Clear inputs
    */

    document
        .getElementById("itemName")
        .value = "";


    document
        .getElementById("itemDescription")
        .value = "";


    /*
        Reload table
    */

    loadItems();

}


/* =====================================================
   LOAD ITEMS
   ===================================================== */

async function loadItems() {


    const tableBody =
        document
        .getElementById("tableBody");


    tableBody.innerHTML = `

        <tr>

            <td
                colspan="5"
                class="loading">

                Loading...

            </td>

        </tr>

    `;


    /*
        Start query
    */

    let query =
        db
        .from("household_items")
        .select("*")
        .eq(
            "category",
            currentTab
        );


    /*
        Today's Task:
        Only show today's items
    */

    if (currentTab === "tasks") {

        query =
            query.eq(
                "task_date",
                getTodayDate()
            );

    }


    /*
        Newest first
    */

    query =
        query.order(
            "created_at",
            {
                ascending: false
            }
        );


    const { data, error } =
        await query;


    if (error) {

        console.error(error);

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="loading">

                    ❌ Unable to load data

                </td>

            </tr>

        `;

        return;

    }


    renderTable(data);

}


/* =====================================================
   RENDER TABLE
   ===================================================== */

function renderTable(items) {


    const tableBody =
        document
        .getElementById("tableBody");


    tableBody.innerHTML = "";


    if (
        !items ||
        items.length === 0
    ) {

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    class="loading">

                    No items added yet ❤️

                </td>

            </tr>

        `;

        return;

    }


    items.forEach(
        (item, index) => {


            const row =
                document.createElement("tr");


            if (item.completed) {

                row.classList.add(
                    "completed"
                );

            }


            row.innerHTML = `

                <td>
                    ${index + 1}
                </td>


                <td>
                    ${escapeHTML(
                        item.name
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        item.description || ""
                    )}
                </td>


                <td>

                    <input

                        type="checkbox"

                        class="status-checkbox"

                        ${
                            item.completed
                            ? "checked"
                            : ""
                        }

                        onchange="
                            toggleStatus(
                                ${item.id},
                                ${item.completed}
                            )
                        "

                    >

                </td>


                <td>

                    <button

                        class="delete-btn"

                        onclick="
                            deleteItem(
                                ${item.id}
                            )
                        "

                    >

                        🗑️ Delete

                    </button>

                </td>

            `;


            tableBody.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   UPDATE STATUS
   ===================================================== */

async function toggleStatus(
    id,
    currentStatus
) {


    const newStatus =
        !currentStatus;


    const { error } =
        await db
        .from("household_items")
        .update({

            completed:
                newStatus

        })
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        alert(
            "Unable to update status."
        );

        return;

    }


    loadItems();

}


/* =====================================================
   DELETE ITEM
   ===================================================== */

async function deleteItem(id) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this item?"
        );


    if (!confirmDelete) {

        return;

    }


    const { error } =
        await db
        .from("household_items")
        .delete()
        .eq(
            "id",
            id
        );


    if (error) {

        console.error(error);

        alert(
            "Unable to delete item."
        );

        return;

    }


    loadItems();

}


/* =====================================================
   HTML SECURITY
   ===================================================== */

function escapeHTML(text) {


    const div =
        document.createElement("div");


    div.textContent =
        text;


    return div.innerHTML;

}


/* =====================================================
   START WEBSITE
   ===================================================== */

loadItems();

</script>


</body>

</html>
